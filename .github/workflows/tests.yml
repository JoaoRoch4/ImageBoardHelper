# The checks of `npm run check`, one step each, and the browser tests in a
# headless Firefox (Playwright), on every push to main, every pull request
# and by hand (Actions → Tests → Run workflow).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, type-check, lint, tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      # The build erases the types and joins src/ into the userscript, with
      # its own checks (the code unchanged, one scope for all the modules,
      # no value read before its module loads), and the committed file must
      # be what src/ builds.
      - name: Build and compare with the committed userscript
        run: node tools/build.mts --check
      - name: Type-check src/ and tools/ (TypeScript 7)
        run: npm run -s typecheck
      - name: ESLint
        run: npx eslint
      - name: I18N tables have the same keys
        run: node tools/check-i18n.js
      - name: Tool tests (build checks, rish, phone server, video reducer)
        run: npm run -s test:tools
      - name: Keep the built userscript
        run: node tools/build.mts
      - uses: actions/upload-artifact@v7
        with:
          name: image-board-helper.user.js
          path: image-board-helper.user.js

  browser:
    name: Browser ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false   # each test says something of its own
      matrix:
        # smoke loads safebooru.org live; the others fake the network.
        test: [smoke, 'test:gif', 'test:fav', 'test:url']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-modules
      # Playwright's Firefox and the .deb files of the system libraries it
      # needs, kept by the cache: the browser under the Playwright version,
      # the libraries under the runner's image too, since the image decides
      # which ones are missing. Fetching both took 14-19 s in every job; a
      # hit installs the kept .debs with dpkg, no apt-get update, no download.
      - name: Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Firefox and its libraries, from the cache
        id: firefox
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/firefox-debs
          key: playwright-firefox-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.playwright.outputs.version }}
      - name: Firefox and its libraries, downloaded
        if: steps.firefox.outputs.cache-hit != 'true'
        run: |
          npx playwright install firefox
          # The libraries this runner lacks, their own dependencies included:
          # Playwright's dry run lists what apt-get would install. Downloaded
          # only, into the folder the cache keeps.
          sudo apt-get update
          missing=$(npx playwright install-deps --dry-run firefox | sed -n 's/^  //p')
          mkdir -p ~/firefox-debs/partial
          if [ -n "$missing" ]; then
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$HOME/firefox-debs" $missing
          fi
          sudo rm -rf ~/firefox-debs/partial ~/firefox-debs/lock
          ls ~/firefox-debs | wc -l
      - name: Firefox's libraries, installed
        run: |
          set -- ~/firefox-debs/*.deb
          # Playwright's own install is the fallback, should a kept .deb no
          # longer fit the runner.
          if [ -e "$1" ]; then sudo dpkg -i "$@" || npx playwright install-deps firefox; fi
      - run: npm run -s ${{ matrix.test }}
